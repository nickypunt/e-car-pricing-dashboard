<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e-car Loan Pricing Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#dfe3e8;--accent:#2b7bbf;--best:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--ink:#e8ecf1;--mute:#93a0b0;--line:#2c3541;--accent:#5aa9e6;--best:#ff6b6b}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--ink:#e8ecf1;--mute:#93a0b0;--line:#2c3541;--accent:#5aa9e6;--best:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 0}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 24px 24px;max-width:1150px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ctl{margin-bottom:14px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:5px}
.ctl label b{color:var(--ink);font-weight:600}
select,input[type=range]{width:100%}
select{padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--mute)}
.kpi div{font-size:24px;font-weight:700;margin-top:2px}
.kpi:first-child div{color:var(--best)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:inherit}
.note{font-size:12px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>e-car Loan Pricing Dashboard</h1>
  <p>Find the APR that maximizes expected profit for a given applicant and market.</p>
</header>
<main>
  <section class="card" id="controls"></section>
  <section>
    <div class="kpis">
      <div class="kpi"><span>Best APR</span><div id="kBest">–</div></div>
      <div class="kpi"><span>Expected profit</span><div id="kProfit">–</div></div>
      <div class="kpi"><span>Acceptance prob.</span><div id="kProb">–</div></div>
    </div>
    <div class="card">
      <svg id="chart" viewBox="0 0 760 440" role="img" aria-label="Expected profit versus APR"></svg>
      <p class="note">Demo model: replace <code>pricingModel()</code> in the script with your real pricing_helper logic (ported or exported as a lookup grid).</p>
    </div>
  </section>
</main>
<script>
// ---------- Pricing model (PLACEHOLDER: swap in the real pricing_helper logic) ----------
// Returns expected profit ($) for a given APR (%) and inputs.
function pricingModel(p, apr){
  const lossRate = 0.4 + (860 - p.FICO) / 275 * 2.2      // annual expected loss %, worse FICO = higher
    + (p.Tier - 1) * 0.15
    + ({N:0, U:0.3, R:0.5})[p.Car_Type]
    + (p.Term - 36) / 36 * 0.2;
  const partnerShift = ({1:0.3, 2:0, 3:-0.3})[p.Partner_Bin];   // partner pull on acceptance
  const mid = p.Competition_rate + partnerShift - (p.Tier - 3) * 0.1;
  const k = 1.1;                                          // price sensitivity
  const prob = 1 / (1 + Math.exp(k * (apr - mid)));       // acceptance probability
  const margin = apr - p.Cost_of_Funds - lossRate;        // % per year
  const avgLifeYears = p.Term / 12 * 0.5;                 // average outstanding balance factor
  return {prob, profit: prob * margin / 100 * p.Amount * avgLifeYears};
}

// ---------- Controls ----------
const spec = [
  {k:'Tier', type:'select', opts:[1,2,3,4], v:3},
  {k:'FICO', type:'range', min:585, max:860, step:1, v:697},
  {k:'Term', type:'select', opts:[36,48,60,66,72], v:60},
  {k:'Amount', type:'range', min:5, max:100000, step:100, v:21400},
  {k:'Car_Type', type:'select', opts:['N','U','R'], v:'U'},
  {k:'Competition_rate', type:'range', min:2.99, max:6.45, step:0.01, v:4.8},
  {k:'Cost_of_Funds', type:'range', min:1.02, max:2.127, step:0.001, v:1.3},
  {k:'Partner_Bin', type:'select', opts:[1,2,3], v:3}
];
const state = {};
const box = document.getElementById('controls');
spec.forEach(s=>{
  state[s.k] = s.v;
  const d = document.createElement('div'); d.className='ctl';
  const lab = document.createElement('label');
  lab.innerHTML = `<span>${s.k.replace(/_/g,' ')}</span><b></b>`;
  const out = lab.querySelector('b');
  let el;
  if(s.type==='select'){
    el = document.createElement('select');
    s.opts.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===s.v)op.selected=true;el.appendChild(op)});
  } else {
    el = document.createElement('input'); el.type='range';
    el.min=s.min; el.max=s.max; el.step=s.step; el.value=s.v;
  }
  const upd = ()=>{
    state[s.k] = (s.k==='Car_Type') ? el.value : parseFloat(el.value);
    out.textContent = s.type==='range' ? (+el.value).toLocaleString(undefined,{maximumFractionDigits:3}) : el.value;
  };
  el.addEventListener('input', ()=>{upd(); render();});
  upd();
  d.appendChild(lab); d.appendChild(el); box.appendChild(d);
});

// ---------- Chart ----------
const W=760,H=440,m={l:70,r:25,t:20,b:60};
const x0=2,x1=10;
function render(){
  const pts=[]; let best={apr:x0,profit:-Infinity,prob:0};
  for(let i=0;i<=320;i++){
    const apr = x0 + (x1-x0)*i/320, r = pricingModel(state,apr);
    pts.push([apr,r.profit]);
    if(r.profit>best.profit) best={apr,profit:r.profit,prob:r.prob};
  }
  const ymax = Math.max(1, best.profit*1.1);
  const ymin = Math.min(0, ...pts.map(p=>p[1]));
  const X=a=>m.l+(a-x0)/(x1-x0)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);
  const step = niceStep((ymax-ymin)/5);
  let s='';
  for(let v=Math.ceil(ymin/step)*step; v<=ymax; v+=step){
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`;
    s+=`<text x="${m.l-10}" y="${Y(v)+5}" text-anchor="end" font-size="15">${Math.round(v).toLocaleString()}</text>`;
  }
  for(let a=x0;a<=x1;a++) s+=`<text x="${X(a)}" y="${H-m.b+24}" text-anchor="middle" font-size="15">${a}</text>`;
  s+=`<line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink)"/>`;
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(Math.max(ymin,0))}" y2="${Y(Math.max(ymin,0))}" stroke="var(--ink)"/>`;
  s+=`<path d="M${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  s+=`<line x1="${m.l}" x2="${X(best.apr)}" y1="${Y(best.profit)}" y2="${Y(best.profit)}" stroke="var(--best)" stroke-width="2" stroke-dasharray="6 5"/>`;
  s+=`<line x1="${X(best.apr)}" x2="${X(best.apr)}" y1="${Y(best.profit)}" y2="${Y(Math.max(ymin,0))}" stroke="var(--best)" stroke-width="2" stroke-dasharray="6 5"/>`;
  const lx = best.apr>8 ? X(best.apr)-12 : X(best.apr)+10;
  s+=`<text x="${lx}" y="${H-m.b-14}" font-size="20" text-anchor="${best.apr>8?'end':'start'}" style="fill:var(--best)">Best APR: ${best.apr.toFixed(2)}%</text>`;
  s+=`<text x="${(m.l+W-m.r)/2}" y="${H-12}" text-anchor="middle" font-size="18">APR (%)</text>`;
  s+=`<text transform="translate(18 ${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle" font-size="18">Expected Profit ($)</text>`;
  document.getElementById('chart').innerHTML=s;
  document.getElementById('kBest').textContent=best.apr.toFixed(2)+'%';
  document.getElementById('kProfit').textContent='$'+Math.round(best.profit).toLocaleString();
  document.getElementById('kProb').textContent=(best.prob*100).toFixed(1)+'%';
}
function niceStep(r){const e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return (f<1.5?1:f<3?2:f<7?5:10)*e}
render();
</script>
</body>
</html>
